name: Android & KMP CI

on:
  push:
    branches: [ main, integrate/whiteboard-revamp ]
  pull_request:
    branches: [ main, integrate/whiteboard-revamp ]

jobs:
  test:
    name: Run KMP & Android Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run KMP & Android Unit/Integration Tests
        run: ./gradlew test --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon
