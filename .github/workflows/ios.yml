name: iOS Build

on:
  push:
    branches: [ main, integrate/whiteboard-revamp ]
  pull_request:
    branches: [ main, integrate/whiteboard-revamp ]

jobs:
  build-ios:
    name: Build iOS SwiftUI App
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shared KMP Framework for iOS
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild -project iosApp/TradeLikeAHedgeFund.xcodeproj \
                     -scheme TradeLikeAHedgeFund \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
