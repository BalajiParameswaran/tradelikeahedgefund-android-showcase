name: iOS Build

on:
  push:
    branches: [ main, integrate/whiteboard-revamp ]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main, integrate/whiteboard-revamp ]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/ios.yml'

jobs:
  build-ios:
    name: Build iOS SwiftUI App
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # NOTE: no standalone "embedAndSignAppleFrameworkForXcode" step here:
      # that Gradle task is designed to be invoked BY Xcode during the app
      # build (it reads Xcode-provided environment variables) and fails when
      # run bare from CI with exit code 1.

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild -project iosApp/TradeLikeAHedgeFund.xcodeproj \
                     -scheme TradeLikeAHedgeFund \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
